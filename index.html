<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ماڵپەڕی فەرمی من | Hama Dev AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: space-between;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background-color: rgba(15, 23, 42, 0.9);
            border-bottom: 1px solid #1e293b;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #38bdf8;
        }

        nav a {
            color: #cbd5e1;
            text-decoration: none;
            margin-left: 20px;
            transition: 0.3s;
        }

        nav a:hover {
            color: #38bdf8;
        }

        .hero {
            text-align: center;
            padding: 50px 20px;
            max-width: 800px;
            margin: auto;
        }

        .hero h1 {
            font-size: 42px;
            margin-bottom: 20px;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            font-size: 18px;
            color: #94a3b8;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        /* بەشی دوگمەکان */
        .buttons-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .btn {
            background: linear-gradient(to right, #0ea5e9, #6366f1);
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.3);
        }

        .btn:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }

        footer {
            text-align: center;
            padding: 20px;
            background-color: #0b0f19;
            color: #64748b;
            border-top: 1px solid #1e293b;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Hama Dev</div>
        <nav>
            <a href="#">سەرەکی</a>
            <a href="#">دەربارە</a>
            <a href="#">پەیوەندی</a>
        </nav>
    </header>

    <section class="hero">
        <h1>بە خێر بێن بۆ ماڵپەڕەکەم</h1>
        <p>لێرەوە دەتوانیت بە یەک کلیک سەردانی ئەم لینکە ڕاستەوخۆیانە بکەیت:</p>
        
        <!-- سێ دوگمەکەی سایتەکە -->
        <div class="buttons-container">
            <a href="https://hamadev19.github.io/hamadev/" target="_blank" class="btn">سایتی یەکەم (QR و کۆد)</a>
            <a href="https://hamadev19.github.io/-hama-dev-/" target="_blank" class="btn">یاری سەرەکی حەمە دێڤ</a>
            <a href="https://hamadev19.github.io/hama.dev/" target="_blank" class="btn">سایتی سێیەم</a>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 هەموو مافێک پارێزراوە. دروستکراوە لەلایەن Hama Dev AI.</p>
    </footer>

</body>
</html>
